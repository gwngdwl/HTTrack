name: Crawl Website with Playwright

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Start URL to crawl'
        required: true
        default: 'https://www.iaa.org.il/'
      output_dir:
        description: 'Output directory (letters, digits, . _ - only)'
        required: true
        default: 'output'
      max_depth:
        description: 'Max crawl depth'
        required: false
        default: '2'

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright aiohttp
          python -m playwright install

      - name: Resolve output directory
        env:
          RAW_OUTPUT_DIR: ${{ inputs.output_dir }}
        run: |
          CLEAN=$(printf '%s' "$RAW_OUTPUT_DIR" | tr -cd 'A-Za-z0-9._-')
          if [ -z "$CLEAN" ]; then CLEAN=output; fi
          echo "OUTPUT_DIR=$CLEAN" >> "$GITHUB_ENV"
          echo "Output directory: $CLEAN"

      - name: Run crawler
        env:
          START_URL: ${{ inputs.url }}
          MAX_DEPTH: ${{ inputs.max_depth }}
        run: |
          python crawl_site.py "$START_URL" "$OUTPUT_DIR" "${MAX_DEPTH:-2}"

      - name: Archive results
        if: always()
        env:
          OUTPUT_DIR: ${{ env.OUTPUT_DIR || 'output' }}
        run: |
          if [ -d "$OUTPUT_DIR" ]; then
            zip -r -q "crawl-result.zip" "$OUTPUT_DIR"
            ls -lh crawl-result.zip
          else
            echo "No output directory '$OUTPUT_DIR' to archive."
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-crawl-${{ github.run_number }}
          path: crawl-result.zip
          if-no-files-found: warn
          retention-days: 7
