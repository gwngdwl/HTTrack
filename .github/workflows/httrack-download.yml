name: HTTrack Website Copier

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'Website URL to download'
        required: true
        type: string
      project_name:
        description: 'Project name (letters, digits, . _ - only)'
        required: false
        default: 'website'
        type: string

jobs:
  download-website:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install HTTrack
        run: |
          sudo apt-get update
          sudo apt-get install -y httrack

      - name: Resolve project name
        env:
          RAW_PROJECT_NAME: ${{ inputs.project_name }}
        run: |
          CLEAN=$(printf '%s' "$RAW_PROJECT_NAME" | tr -cd 'A-Za-z0-9._-')
          if [ -z "$CLEAN" ]; then CLEAN=website; fi
          echo "PROJECT_NAME=$CLEAN" >> "$GITHUB_ENV"
          echo "Project name: $CLEAN"

      - name: Download website
        env:
          WEBSITE_URL: ${{ inputs.website_url }}
        run: |
          mkdir -p output
          httrack "$WEBSITE_URL" \
            -O "./output/$PROJECT_NAME" \
            -v \
            -%v \
            -N0 \
            -s0 \
            -r99 \
            -c8 \
            -%e0

      - name: Create archive
        if: always()
        env:
          PROJECT_NAME: ${{ env.PROJECT_NAME || 'website' }}
        run: |
          if [ -d "output/$PROJECT_NAME" ]; then
            (cd output && zip -r -q "../$PROJECT_NAME.zip" "$PROJECT_NAME")
            ls -lh "$PROJECT_NAME.zip"
          else
            echo "No downloaded site at output/$PROJECT_NAME to archive."
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-${{ github.run_number }}
          path: ${{ env.PROJECT_NAME || 'website' }}.zip
          if-no-files-found: warn
          retention-days: 7
